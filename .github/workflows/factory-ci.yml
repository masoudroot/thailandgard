name: Factory CI

on:
  # Every pull request is gated: docs, config and schema changes included.
  # Branch protection on main requires this check, so a path filter here
  # would leave some PRs permanently unmergeable.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: site
    env:
      FACTORY_ENV: local
      FACTORY_DATABASE_URL: postgres://factory:factory@localhost:5433/factory
      FACTORY_CONTROL_TOKEN: factory-ci-token-0123456789abcdef
      FACTORY_EVIDENCE_SECRET: factory-ci-evidence-secret-0123456789
      FACTORY_ARTIFACT_DIR: factory/.artifacts-ci
      TEST_DATABASE_URL: postgres://factory:factory@localhost:5433/factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:factory
      - run: npm run factory:schemas
      - run: npm run typecheck
      - run: npm run factory:migrate
      - run: npm test
      - run: npm run factory:walking-skeleton
      - run: npm run build
      # Q2-08: security report only. `npm audit` exit codes must never block a
      # PR, because some advisories live in dev-only or upstream packages we
      # cannot patch ourselves. The report is kept as a CI artifact.
      - name: npm audit report (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e "
            const fs = require('fs');
            let report = null;
            try { report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8').replace(/^\uFEFF/, '').trim()); } catch { report = null; }
            if (!report || !report.metadata) {
              console.log('npm audit produced no parsable JSON; skipping summary');
              process.exit(0);
            }
            const v = report.metadata.vulnerabilities ?? {};
            console.log('total=' + (v.total ?? 0) + ' critical=' + (v.critical ?? 0) + ' high=' + (v.high ?? 0) + ' moderate=' + (v.moderate ?? 0) + ' low=' + (v.low ?? 0));
            const summary = ['# npm audit report', '', '| severity | count |', '|---|---|',
              '| critical | ' + (v.critical ?? 0) + ' |',
              '| high | ' + (v.high ?? 0) + ' |',
              '| moderate | ' + (v.moderate ?? 0) + ' |',
              '| low | ' + (v.low ?? 0) + ' |',
              '| **total** | **' + (v.total ?? 0) + '** |', ''];
            for (const [name, adv] of Object.entries(report.vulnerabilities ?? {})) {
              summary.push('- ' + name + ' (' + adv.severity + ')');
            }
            fs.writeFileSync('npm-audit-summary.md', summary.join('\n'));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: |
            site/npm-audit.json
            site/npm-audit-summary.md
          if-no-files-found: ignore
      # Q3-08: بودجهٔ کارایی + axe در همان job و همان چک اجباری `test`.
      # آستانه‌ها از docs/ops/perf-budget.md می‌آیند (ADR-013).
      - name: Lighthouse gate (performance budget + axe)
        run: npx lhci autorun
