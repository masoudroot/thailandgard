name: Factory Daily

# Scheduled factory canary: keeps the end-to-end path verified every day
# without touching production (in-process runner, ADR-011).
on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC = 07:00 Tehran
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-daily
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: site
    env:
      FACTORY_ENV: local
      FACTORY_DATABASE_URL: postgres://factory:factory@localhost:5433/factory
      FACTORY_CONTROL_TOKEN: factory-ci-token-0123456789abcdef
      FACTORY_EVIDENCE_SECRET: factory-ci-evidence-secret-0123456789
      FACTORY_ARTIFACT_DIR: factory/.artifacts-ci
      TEST_DATABASE_URL: postgres://factory:factory@localhost:5433/factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run factory:migrate
      - run: npm run factory:walking-skeleton
      - run: npx vitest run factory/tests/api-pipeline.integration.test.ts factory/tests/health.test.ts
      - name: Upload factory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-daily-artifacts-${{ github.run_id }}
          path: site/factory/.artifacts-ci
          if-no-files-found: ignore
          retention-days: 14
